name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release compatibility contract
        shell: pwsh
        run: ./scripts/Test-ReleaseContract.ps1 -Repository open-giftcard/open-giftcard-portal

      # Fails when contracts/README.md declares a hash that is not the file's.
      # The in-repo contract assertions validate the committed document, so a
      # stale document passes them; only this compares the pin to reality.
      - name: Backend contract pin matches its recorded hash
        shell: bash
        run: bash scripts/verify-contract-pin.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/GiftCardPortal.Web/pnpm-lock.yaml

      - name: Restore .NET
        run: dotnet restore GiftCardPortal.slnx

      - name: Install frontend
        working-directory: src/GiftCardPortal.Web
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        working-directory: src/GiftCardPortal.Web
        run: |
          pnpm peers check
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Committed SPA bundle matches source
        shell: pwsh
        run: ./scripts/Verify-FrontendBundle.ps1

      - name: BFF and contract tests
        run: dotnet test GiftCardPortal.slnx --no-restore --configuration Release
