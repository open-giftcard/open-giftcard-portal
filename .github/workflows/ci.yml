name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/GiftCardPortal.Web/pnpm-lock.yaml

      - name: Restore .NET
        run: dotnet restore GiftCardPortal.slnx

      - name: Install frontend
        working-directory: src/GiftCardPortal.Web
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        working-directory: src/GiftCardPortal.Web
        run: |
          pnpm peers check
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: BFF and contract tests
        run: dotnet test GiftCardPortal.slnx --no-restore --configuration Release
