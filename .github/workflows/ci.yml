name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fails when contracts/README.md declares a hash that is not the file's.
      # The in-repo contract assertions validate the committed document, so a
      # stale document passes them; only this compares the pin to reality.
      - name: Backend contract pin matches its recorded hash
        shell: bash
        run: bash scripts/verify-contract-pin.sh

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/GiftCardPortal.Web/pnpm-lock.yaml

      - name: Restore .NET
        run: dotnet restore GiftCardPortal.slnx

      - name: Install frontend
        working-directory: src/GiftCardPortal.Web
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        working-directory: src/GiftCardPortal.Web
        run: |
          pnpm peers check
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Committed SPA bundle matches source
        shell: pwsh
        run: ./scripts/Verify-FrontendBundle.ps1

      - name: BFF and contract tests
        run: dotnet test GiftCardPortal.slnx --no-restore --configuration Release
